# BonettoR32V formal, per-candidate (fast) config. Read by run_formal.py.
# Contract-owned: hypothesis agents never edit this file.
#
# Depth policy (run_formal.py, never set by an agent). Every check here runs at the
# short depth, from the timing measured on the candidate (cosim --timing-json, else
# verif/formal/timing_tb.v):
#   d_short(class) = reset_steps + first_retire_cycle + max_cycles(class) + depth_margin
# The instruction checks run in class groups (run_formal.CLASS_GROUPS), each at the
# short depth of its slowest member class; every other check uses the slowest class
# measured (max_cycles_per_insn). So each trace covers the first retirement and one
# more retirement of the class under check. d_short above depth_cap fails the gate.
#
# Not in this config: liveness (the 1,024-edge retirement cap) and the second
# retirement after the slowest first one (the full depth D). Both are in
# checks-deep.cfg. See docs/formal.md ("Fast and deep") for the measured runtimes.

[suite]
name = fast
depth_floor = 0
depth_cap = 2048
depth_margin = 2
reset_steps = 1
timeout_s = 21600
jobs = 8

[engines]
# smtbmc <solver> step=all: one solver call checks every step up to the depth.
# bitwuzla: yices stalls on the bus checks (see docs/formal.md). reach: small windows,
# stops as soon as every required trigger is reached.
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short] [groups=<n>|class]
insn = insn groups=class depth=short
bus_imem = bmc depth=short
bus_dmem = bmc depth=short
spi = bmc depth=short
rvfi = bmc depth=short
ill = bmc depth=short
silent = bmc depth=short
causal = bmc depth=short
unique = bmc depth=short
pc_fwd = bmc depth=short
pc_bwd = bmc depth=short
gpio = bmc depth=short
reset = bmc depth=short
reg = bmc depth=short
cover = cover depth=short
