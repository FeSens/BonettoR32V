# BonettoR32V formal, fast config (contract v3; every 10th merged improvement). Read by
# run_formal.py. Contract-owned: hypothesis agents never edit this file.
#
# Depth policy (run_formal.py, never set by an agent), from the timing the cosim measures on
# the candidate (run_cosim.py --timing-json, max over the built programs) and from each check's
# own reach task:
#   depth=reach  The reach task runs first, at the short depth (the cap: reset_steps +
#                first_retire_cycle + max_cycles(class) + depth_margin, 613 on champion 112).
#                The proof then runs to one past the last step of the solver window (29 steps)
#                in which the last of its required triggers was first reached, plus
#                depth_margin, never below reset_steps + first_retire_cycle + depth_margin (308
#                on 112: the memory reset sequence and the first retirement in the slowest
#                power-up mode the cosim ran) and never above the cap. So each proof covers
#                every trace from reset up to the step where every behavior it requires (its
#                triggers) has occurred: in practice the first one or two retirements after
#                reset, any power-up mode, free registers, flash and PSRAM. A trigger not reached
#                within the cap is UNREACHED (a FAIL).
# This is a bound below the short depth, stated per check in docs/formal.md ("Fast and deep");
# checks-deep.cfg keeps every check at its full depth. Why: on champion 112 (6810e6f,
# hwe-bench) the proofs of reg, psram_write, coherence, csr and three instruction groups hit
# TIMEOUT at 18,000 s at the short depth 613 (one solver call), while csr took 2,870 s at 484;
# on champion 111 coherence (870) and irq (1,448) hit TIMEOUT at 44,000 s.
#   coherence    the fetches and loads of the first retirements against the image (reach: a
#                fetch and a load of the symbolic byte). A store followed by a load of the same
#                byte needs cpi=2: deep.
#   csr          the CSR reads of the first retirements (reset values of MIE, MPIE, MEIE,
#                MPP = 3, the read-only and zero bits, mip, misa, mtval, the id CSRs) and the
#                first trap and MRET (reach: a CSR read, a trap, an MRET). A trap, MRET or read
#                that compares with a value learned or written before it needs cpi=2: deep.
#   irq          not here: an interrupt entry needs an IO store and two CSR writes first;
#                cpi=4 in deep.
# A base depth above depth_cap fails the gate.
#
# timeout_s (per SBY task): 18,000 s (5 h), so a run fits in about 6 hours on hwe-bench (the
# lead's target, 2026-10-18). A check that cannot finish within it FAILs (TIMEOUT) and has to be
# restructured, not given more time here.
# jobs: a cap; run_formal.py lowers it to what memory holds (each task waits for its own
# estimate).
# Not in this config: liveness (the 2,048-cycle retirement cap) and irq, in checks-deep.cfg (the
# lead's ruling R9 for v2, kept for v3). See docs/formal.md ("Fast and deep").

[suite]
name = fast
depth_floor = 0
depth_cap = 2048
depth_margin = 2
reset_steps = 1
timeout_s = 18000
jobs = 12

[engines]
# smtbmc <solver> step=all: one solver call checks every step up to the depth.
# bitwuzla: yices stalls on the bus checks (see docs/formal.md). reach: small windows,
# stops as soon as every required trigger is reached.
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short|reach] [cpi=<n>]
#         [groups=<n>|class] [reach=<label>,...]   (the triggers required, a subset of the
#         check's)
insn = insn groups=class depth=reach
qspi = bmc depth=reach
psram_write = bmc depth=reach
coherence = bmc depth=reach reach=reach_coherence_fetch,reach_coherence_load
csr = bmc depth=reach reach=reach_csr_read,reach_csr_trap,reach_csr_mret
rvfi = bmc depth=reach
ill = bmc depth=reach
causal = bmc depth=reach
unique = bmc depth=reach
pc_fwd = bmc depth=reach
pc_bwd = bmc depth=reach
gpio = bmc depth=reach
periph = bmc depth=reach
reset = bmc depth=reach
reg = bmc depth=reach
cover = cover depth=reach
