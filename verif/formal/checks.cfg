# BonettoR32V formal, per-candidate (fast) config. Read by run_formal.py.
# Contract-owned: hypothesis agents never edit this file.
#
# Depth policy (run_formal.py, never set by an agent):
#   D = max(depth_floor, reset_steps + max(first_retire_cycle, max_cycles_per_insn)
#                        + max_cycles_per_insn + depth_margin)
# with the timing measured on the candidate (cosim --timing-json, else
# verif/formal/timing_tb.v). D covers at least two retirements of the slowest
# instruction class the selftest measures. D > depth_cap fails the gate.
# See docs/formal.md for the measured runtimes behind these numbers.

[suite]
name = fast
depth_floor = 0
depth_cap = 1100
depth_margin = 2
reset_steps = 1
timeout_s = 3600
jobs = 8

[engines]
# smtbmc <solver> step=all: one solver call checks every step up to D.
bmc = smtbmc yices step=all
reach = smtbmc yices step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>]
insn = insn
reg = bmc
pc_fwd = bmc
pc_bwd = bmc
causal = bmc
unique = bmc
bus_imem = bmc
bus_dmem = bmc
gpio = bmc
spi = bmc
rvfi = bmc
ill = bmc
silent = bmc
reset = bmc
liveness = bmc depth_add=1024
cover = cover
