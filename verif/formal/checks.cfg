# BonettoR32V formal, fast config (contract v3; signoff and every 10th merged improvement).
# Read by run_formal.py. Contract-owned: hypothesis agents never edit this file.
#
# Depth policy (run_formal.py, never set by an agent), from the timing the cosim measures on
# the candidate (run_cosim.py --timing-json, max over the built programs):
#   depth=short  reset_steps + first_retire_cycle + max_cycles(class) + depth_margin
#                The instruction checks run in class groups (run_formal.CLASS_GROUPS), each at
#                the short depth of its slowest member class; every other check uses the
#                slowest class measured (max_cycles_per_insn). Each trace covers the first
#                retirement and one more retirement of the class under check.
#   cpi=N        reset_steps + first_retire_cycle + N x max_cycles_per_insn + depth_margin,
#                for the checks whose triggers relate several instructions: coherence (a store,
#                then a load of the same byte) and csr (a CSR write or a trap, then a read) at
#                N = 2; irq (an IO store and two CSR writes enable the interrupt, then the
#                entry and the handler's first instruction) at N = 4.
# A base depth above depth_cap fails the gate.
#
# timeout_s (per SBY task): 2 x the longest task measured: reg, 21,934 s on hwe-bench, fc07cc3
# reg-only run, host shared (contract-v2 hyp/002-rf-in-ram, depth 1,222; 2 x 21,933.8 s =
# 43,867.6 s, rounded up to 44,000). V2 (b9a5211)'s reg took 19,669 s.
# jobs: a cap; run_formal.py lowers it to what memory holds at the run's depth.
# Not in this config: liveness (the 2,048-cycle retirement cap), in checks-deep.cfg (the
# lead's ruling R9 for v2, kept for v3). See docs/formal.md ("Fast and deep").

[suite]
name = fast
depth_floor = 0
depth_cap = 2048
depth_margin = 2
reset_steps = 1
timeout_s = 44000
jobs = 8

[engines]
# smtbmc <solver> step=all: one solver call checks every step up to the depth.
# bitwuzla: yices stalls on the bus checks (see docs/formal.md). reach: small windows,
# stops as soon as every required trigger is reached.
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short] [cpi=<n>] [groups=<n>|class]
insn = insn groups=class depth=short
qspi = bmc depth=short
psram_write = bmc depth=short
coherence = bmc cpi=2
csr = bmc cpi=2
irq = bmc cpi=4
rvfi = bmc depth=short
ill = bmc depth=short
causal = bmc depth=short
unique = bmc depth=short
pc_fwd = bmc depth=short
pc_bwd = bmc depth=short
gpio = bmc depth=short
periph = bmc depth=short
reset = bmc depth=short
reg = bmc depth=short
cover = cover depth=short
