# BonettoR32V formal, fast config (contract v3; every 10th merged improvement). Read by
# run_formal.py. Contract-owned: hypothesis agents never edit this file.
#
# Depth policy (run_formal.py, never set by an agent), from the timing the cosim measures on
# the candidate (run_cosim.py --timing-json, max over the built programs):
#   depth=short  reset_steps + first_retire_cycle + max_cycles(class) + depth_margin
#                The instruction checks run in class groups (run_formal.CLASS_GROUPS), each at
#                the short depth of its slowest member class; every other check uses the
#                slowest class measured (max_cycles_per_insn). Each trace covers the first
#                retirement and one more retirement of the class under check.
# Every check here runs at the short depth (581 on champion 111). The checks whose properties
# relate several instructions are bounded there and run at their full depth in checks-deep.cfg
# (cpi=N):
#   coherence    fast: the fetches and loads of the first two retirements against the image
#                (reach: a fetch and a load of the symbolic byte). A store followed by a load of
#                the same byte needs cpi=2 (870): deep.
#   csr          fast: the CSR reads of the first two retirements (reset values of MIE, MPIE,
#                MEIE, MPP = 3, the read-only and zero bits, mip, misa, mtval, the id CSRs) and
#                the first trap and MRET (reach: a CSR read, a trap, an MRET). A trap, MRET or
#                read that compares with a value learned or written before it (csr_trap_target,
#                csr_mret_target, a read after a write or a trap) needs cpi=2: deep.
#   irq          not here: an interrupt entry needs an IO store and two CSR writes first, about
#                1,100 steps; cpi=4 (1,448) in deep.
# Why: on champion 111 (346c4a3, hwe-bench, 3 jobs) coherence at 870 and irq at 1,448 ran into
# the 44,000 s task timeout (TIMEOUT 44,001.8 s and 44,002.0 s, peak RSS 12.6 GB and 27.2 GB)
# and csr at 870 was past 41,000 s (15.3 GB) when the run was stopped: the run finished 2 of
# 52 tasks in 12 hours (docs/formal.md, "Fast and deep").
# A base depth above depth_cap fails the gate.
#
# timeout_s (per SBY task): 18,000 s (5 h), so a run fits in about 6 hours on hwe-bench (the
# lead's target, 2026-10-18). A check that cannot finish at the short depth within it FAILs
# (TIMEOUT) and has to be restructured, not given more time here.
# jobs: a cap; run_formal.py lowers it to what memory holds (each task waits for its own
# estimate).
# Not in this config: liveness (the 2,048-cycle retirement cap) and irq, in checks-deep.cfg (the
# lead's ruling R9 for v2, kept for v3). See docs/formal.md ("Fast and deep").

[suite]
name = fast
depth_floor = 0
depth_cap = 2048
depth_margin = 2
reset_steps = 1
timeout_s = 18000
jobs = 12

[engines]
# smtbmc <solver> step=all: one solver call checks every step up to the depth.
# bitwuzla: yices stalls on the bus checks (see docs/formal.md). reach: small windows,
# stops as soon as every required trigger is reached.
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short] [cpi=<n>] [groups=<n>|class]
#         [reach=<label>,...]   (the triggers required at this depth, a subset of the check's)
insn = insn groups=class depth=short
qspi = bmc depth=short
psram_write = bmc depth=short
coherence = bmc depth=short reach=reach_coherence_fetch,reach_coherence_load
csr = bmc depth=short reach=reach_csr_read,reach_csr_trap,reach_csr_mret
rvfi = bmc depth=short
ill = bmc depth=short
causal = bmc depth=short
unique = bmc depth=short
pc_fwd = bmc depth=short
pc_bwd = bmc depth=short
gpio = bmc depth=short
periph = bmc depth=short
reset = bmc depth=short
reg = bmc depth=short
cover = cover depth=short
