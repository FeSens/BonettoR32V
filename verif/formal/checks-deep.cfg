# BonettoR32V formal, champion (deep) config (contract v3). Read by run_formal.py --deep.
# Contract-owned: hypothesis agents never edit this file.
#
# Every check of checks.cfg at the full depth, plus liveness:
#   D = max(depth_floor, reset_steps + max(first_retire_cycle, max_cycles_per_insn)
#                        + max_cycles_per_insn + depth_margin)
# D covers the slowest first retirement followed by a retirement of the slowest class. The
# cpi=N checks keep their depth (reset_steps + first_retire_cycle + N x max_cycles_per_insn
# + depth_margin), at least D for N >= 2. liveness runs at D + 2,048 (every 2,048-cycle window
# that closes within D, contract 4). The cap bounds the base depths only.
# See docs/formal.md ("Fast and deep") for the measured runtimes.
# timeout_s: 2 x reg, 21,934 s on hwe-bench, fc07cc3 reg-only run, host shared, rounded up to
# 44,000 (never below the fast config's). coherence, csr and irq at their full depth are not
# known to finish in it: on champion 111 coherence (870) and irq (1,448) hit TIMEOUT at 44,000 s
# with peak RSS 12.6 GB and 27.2 GB (still growing), and csr (870) was past 41,000 s at 15.3 GB.
# They get 172,800 s (2 days) each; not yet measured to pass, and irq may outgrow a shared
# 62 GB host first (docs/formal.md, "Fast and deep").

[suite]
name = deep
depth_floor = 0
depth_cap = 4096
depth_margin = 2
reset_steps = 1
timeout_s = 44000
jobs = 8

[engines]
# bmc: one solver call per proof, liveness included. 64-step windows for liveness were
# tried (docs/formal.md, "Engines tried"): fast on the stall mutants, but on the v2 seed the
# proof at depth 1,487 ran past 33 minutes at 16 GB, against 658 s with one call.
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short] [cpi=<n>] [groups=<n>|class]
insn = insn groups=8
reg = bmc
pc_fwd = bmc
pc_bwd = bmc
causal = bmc
unique = bmc
qspi = bmc
psram_write = bmc
coherence = bmc cpi=2 timeout=172800
csr = bmc cpi=2 timeout=172800
irq = bmc cpi=4 timeout=172800
gpio = bmc
periph = bmc
rvfi = bmc
ill = bmc
reset = bmc
liveness = bmc depth_add=2048
cover = cover
