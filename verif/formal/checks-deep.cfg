# BonettoR32V formal, champion (deep) config. Read by run_formal.py --deep.
# Contract-owned: hypothesis agents never edit this file.
# Same checks as checks.cfg at a deeper floor (more retirements per trace), plus the
# unbounded PDR proofs that finish on the seed. See docs/formal.md.

[suite]
name = deep
depth_floor = 700
depth_cap = 2048
depth_margin = 2
reset_steps = 1
timeout_s = 14400
jobs = 8

[engines]
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
insn = insn
reg = bmc
pc_fwd = bmc
pc_bwd = bmc
causal = bmc
unique = bmc
bus_imem = bmc
bus_dmem = bmc
gpio = bmc
spi = bmc
rvfi = bmc
ill = bmc
silent = bmc
reset = bmc
liveness = bmc depth_add=1024
cover = cover
