# BonettoR32V formal, champion (deep) config. Read by run_formal.py --deep.
# Contract-owned: hypothesis agents never edit this file.
#
# Every check of checks.cfg at the full depth, plus liveness:
#   D = max(depth_floor, reset_steps + max(first_retire_cycle, max_cycles_per_insn)
#                        + max_cycles_per_insn + depth_margin)
# D covers the slowest first retirement followed by a retirement of the slowest class.
# liveness runs at D + 1,024 (every 1,024-edge window that closes within D). The cap
# bounds D only. See docs/formal.md ("Fast and deep") for the measured runtimes.

[suite]
name = deep
depth_floor = 0
depth_cap = 4096
depth_margin = 2
reset_steps = 1
timeout_s = 21600
jobs = 8

[engines]
bmc = smtbmc bitwuzla step=all
reach = smtbmc bitwuzla step=29
prove = abc pdr

[checks]
# check = kind [engine=<engines key>] [timeout=<s>] [depth=short] [groups=<n>|class]
insn = insn groups=8
reg = bmc
pc_fwd = bmc
pc_bwd = bmc
causal = bmc
unique = bmc
bus_imem = bmc
bus_dmem = bmc
gpio = bmc
spi = bmc
rvfi = bmc
ill = bmc
silent = bmc
reset = bmc
liveness = bmc depth_add=1024
cover = cover
